[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "adaptive-microgrid"
version = "0.1.0"
description = "Reproducible islanded microgrid dispatch and adaptive reserve research workbench"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0", "scipy>=1.14", "pandas>=2.2", "pyarrow>=18", "gymnasium>=1.0", "lightgbm>=4.5", "scikit-learn>=1.6", "pyyaml>=6", "matplotlib>=3.9", "rainflow>=3.2", "openpyxl>=3.1"]

[project.optional-dependencies]
rl = ["stable-baselines3>=2.5", "torch>=2.5"]
dev = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
microgrid = "microgrid.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/microgrid"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["tests/reference_blast"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
